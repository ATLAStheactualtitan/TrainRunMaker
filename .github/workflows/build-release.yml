name: Build Desktop Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: FoxholeTrainRunMaker-windows-x64
            archive: FoxholeTrainRunMaker-windows-x64.zip
          - name: macOS Intel
            os: macos-13
            artifact: FoxholeTrainRunMaker-macos-intel
            archive: FoxholeTrainRunMaker-macos-intel.zip
          - name: macOS Apple Silicon
            os: macos-14
            artifact: FoxholeTrainRunMaker-macos-arm64
            archive: FoxholeTrainRunMaker-macos-arm64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller==6.16.0

      - name: Build application
        run: python -m PyInstaller --clean --noconfirm FoxholeTrainRunMaker.spec

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/FoxholeTrainRunMaker -DestinationPath ${{ matrix.archive }}

      - name: Package macOS build
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/FoxholeTrainRunMaker.app "${{ matrix.archive }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --generate-notes --verify-tag || gh release view "${{ github.ref_name }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.archive }}" --clobber
